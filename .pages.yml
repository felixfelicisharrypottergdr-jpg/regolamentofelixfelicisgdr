          - name: kind
            label: Tipo
            type: select
            required: true
            options: { values: [Scolastica, Extra, Avanzata] }
          - name: schoolYear
            label: Anno scolastico
            type: select
            options: { values: [V, VI, VII] }
          - { name: image, label: Immagine, type: string }
          - name: values
            label: Valori
            type: object
            list:
              collapsible:
                collapsed: true
