media:
  input: public/media
  output: /media

settings:
  content:
    merge: true

components:
  migration:
    type: object
    label: Provenienza e migrazione
    fields:
      - name: status
        label: Stato migrazione
        type: select
        required: true
        options:
          values:
            - { name: to_migrate, label: Da migrare }
            - { name: migrated, label: Migrato }
            - { name: revised, label: Revisionato }
            - { name: verified, label: Verificato }
            - { name: excluded_crafting, label: Escluso — Fabbricazione ONGame }
            - { name: external_png_v1, label: Esterno V1 — Scheda PNG }
            - { name: native, label: Nativo del nuovo sito }
      - name: sources
        label: Fonti
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{document} — {section}"
        fields:
          - { name: document, label: Documento, type: string, required: true }
          - { name: section, label: Sezione, type: string }
          - { name: item, label: Voce / paragrafo, type: string }
          - { name: sourceUrl, label: URL fonte, type: string }
          - { name: note, label: Nota, type: text }

content:
  - name: regulation
    label: Regolamento e pagine
    type: group
    items:
      - name: docs
        label: Pagine e Regole
        type: collection
        path: src/content/docs
        subfolders: true
        format: yaml-frontmatter
        operations:
          create: true
          rename: false
          delete: false
        filename: "{title}.md"
        view:
          primary: title
          fields: [title, contentType]
          search: [title, description, searchAliases]
          sort: [title]
        fields:
          - { name: felixId, label: ID stabile, type: uuid, required: true, options: { editable: false, generate: false } }
          - { name: title, label: Titolo, type: string, required: true }
          - { name: description, label: Descrizione breve, type: text }
          - name: contentType
            label: Tipo
            type: select
            required: true
            options:
              values:
                - { name: landing, label: Pagina di ingresso }
                - { name: rule, label: Regola }
                - { name: free, label: Pagina libera / Altro contenuto }
          - name: searchAliases
            label: Alias di ricerca
            type: string
            list: true
          - name: applicability
            label: Applicabilità
            type: select
            options:
              multiple: true
              values:
                - { name: student, label: PG Studente }
                - { name: adult, label: PG Adulto }
          - name: quickFacts
            label: Da sapere subito
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{label}: {value}"
            fields:
              - { name: label, label: Etichetta, type: string, required: true }
              - { name: value, label: Valore, type: string, required: true }
          - name: quickLinks
            label: Collegamenti utili
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{label}"
            fields:
              - { name: label, label: Etichetta, type: string, required: true }
              - { name: href, label: Percorso o URL, type: string, required: true }
              - { name: description, label: Descrizione breve, type: text }
          - { name: migration, component: migration }
          - { name: prototypeExcerpt, label: Estratto di prototipo, type: boolean }
          - name: body
            label: Contenuto
            type: rich-text
            options:
              media: false


  - name: character
    label: Il Personaggio
    type: group
    items:
      - name: races
        label: Razze — Elenco delle Razze
        type: collection
        path: src/content/races
        format: yaml-frontmatter
        operations: { create: true, rename: false, delete: false }
        filename: "{slug}.md"
        view:
          primary: name
          fields: [name, availablePlaces, status]
          search: [name, description, searchAliases]
          sort: [name]
        fields:
          - { name: id, label: ID stabile, type: uuid, required: true, options: { editable: false, generate: false } }
          - { name: slug, label: Slug URL, type: string, required: true, pattern: "^[a-z0-9-]+$" }
          - { name: name, label: Nome, type: string, required: true }
          - { name: description, label: Descrizione breve, type: text, required: true }
          - { name: image, label: Immagine, type: string }
          - name: applicability
            label: Applicabilità
            type: select
            options:
              multiple: true
              values:
                - { name: student, label: PG Studente }
                - { name: adult, label: PG Adulto }
          - { name: availablePlaces, label: Posti disponibili, type: string, description: "Dato consultativo aggiornabile dallo Staff; non viene calcolato dal sito." }
          - { name: relatedFelixIds, label: Percorsi collegati (UUID), type: string, list: true }
          - { name: searchAliases, label: Alias di ricerca, type: string, list: true }
          - name: status
            label: Stato editoriale
            type: select
            options: { values: [draft, published, archived] }
          - { name: migration, component: migration }
          - { name: body, label: Descrizione, Distribuzione e Tratti Razziali, type: rich-text, options: { media: false } }

  - name: studentGameplay
    label: PG Studente — FantaHogwarts
    type: group
    items:
      - name: missions
        label: Missioni
        type: collection
        path: src/content/missions
        format: yaml-frontmatter
        operations: { create: true, rename: false, delete: false }
        filename: "{slug}.md"
        view:
          primary: name
          fields: [name, category, illegal, completion, schoolYearOnly, status]
          search: [name, description, searchAliases]
          sort: [category, name]
        fields:
          - { name: id, label: ID stabile, type: uuid, required: true, options: { editable: false, generate: false } }
          - { name: slug, label: Slug URL, type: string, required: true, pattern: "^[a-z0-9-]+$" }
          - { name: name, label: Nome Missione, type: string, required: true }
          - { name: description, label: Descrizione breve, type: text, required: true }
          - name: category
            label: Categoria
            type: select
            required: true
            options: { values: [Caotica, Neutrale, Legale] }
          - { name: illegal, label: Prevede rischio/intervento delle Cariche, type: boolean }
          - { name: completion, label: Missione o livello a completamento, type: boolean }
          - { name: schoolYearOnly, label: Missione o livello solo durante l'anno scolastico, type: boolean }
          - name: levels
            label: Livelli
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{name}"
            fields:
              - { name: name, label: Livello, type: string, required: true }
              - { name: action, label: Cosa bisogna fare, type: text }
              - { name: requirements, label: Requisiti, type: string, list: true }
              - { name: rewards, label: Premi, type: string, list: true }
              - { name: ifCaught, label: Se scoperto, type: string, list: true }
              - { name: illegal, label: Livello illegale / intervento Cariche, type: boolean }
              - { name: completion, label: Livello a completamento, type: boolean }
              - { name: schoolYearOnly, label: Solo anno scolastico, type: boolean }
          - { name: searchAliases, label: Alias di ricerca, type: string, list: true }
          - name: status
            label: Stato editoriale
            type: select
            options: { values: [draft, published, archived] }
          - { name: migration, component: migration }
          - { name: body, label: Note e dettagli aggiuntivi, type: rich-text, options: { media: false } }


